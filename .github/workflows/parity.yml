name: parity

# Measures Blitz's CSS geometry against Chromium on the ogre parity corpus.
#
# The box this spike was written on runs `cargo` as a shim that refuses to
# compile (host policy), so the build lives here. Everything the job measures is
# reproducible: pinned Blitz crates, pinned fixtures, one instrument for both
# engines, and the numbers land as an artifact.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # Blitz's font stack links fontconfig; the runner image does not ship
        # the development headers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Build the Blitz renderer
        shell: bash
        # pipefail, so a failed build is not masked by the tail's exit status.
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tail -60

      - name: Locate Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          else
            npx --yes playwright install --with-deps chromium
            echo "CHROME=$(find ~/.cache/ms-playwright -name chrome -type f | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Fetch ogre (same-regime baseline)
        # Blitz and Chromium are both measured on this runner. ogre is fetched
        # too, so its cost is quoted from the SAME machine: a figure taken on a
        # different host is not a comparison.
        run: |
          set -euo pipefail
          V=v3.4.6
          curl -fsSL -o ogre.tar.gz \
            "https://github.com/leshchenko1979/ogre/releases/download/$V/ogre_${V#v}_linux_amd64.tar.gz"
          tar xzf ogre.tar.gz ogre
          chmod +x ogre
          ./ogre --help >/dev/null && echo "ogre baseline ready"

      - name: Measure
        run: python3 tools/run_parity.py --ogre ./ogre

      - name: Upload the built renderer
        # So the binary can be run on documents that must not be committed.
        uses: actions/upload-artifact@v4
        with:
          name: blitz-render
          path: target/release/render
          if-no-files-found: error

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: out/
          if-no-files-found: warn
