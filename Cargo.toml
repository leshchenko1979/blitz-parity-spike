[package]
name = "blitz-parity-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measure Blitz's CSS geometry against Chromium on the ogre parity corpus"

[[bin]]
name = "render"
path = "src/main.rs"

# Pinned to one Blitz release: the API is pre-1.0 and moves between betas, so an
# unpinned build would silently measure a different engine than the one recorded.
[dependencies]
blitz-html = "=0.3.0-beta.4"
blitz-dom = "=0.3.0-beta.4"
blitz-net = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
png = "0.18"
# Needed because blitz-net spawns a tokio task per sub-resource fetch.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3

# Temporary: measure the corpus against the trailing-<br> patch instead of the
# published crate, so the fixture that found the defect is the fixture that
# confirms the fix. Removed once the patch lands upstream.
[patch.crates-io]
blitz-html = { git = "https://github.com/leshchenko1979/blitz", branch = "fix/trailing-br-line-box" }
blitz-dom = { git = "https://github.com/leshchenko1979/blitz", branch = "fix/trailing-br-line-box" }
blitz-net = { git = "https://github.com/leshchenko1979/blitz", branch = "fix/trailing-br-line-box" }
blitz-paint = { git = "https://github.com/leshchenko1979/blitz", branch = "fix/trailing-br-line-box" }
blitz-traits = { git = "https://github.com/leshchenko1979/blitz", branch = "fix/trailing-br-line-box" }
